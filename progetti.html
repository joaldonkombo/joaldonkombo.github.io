<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>progetti</title>
<style>
  body{
    max-width: 640px;
    margin: 10vh auto 10vh;
    padding: 0 24px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 18px;
    line-height: 1.65;
    color: #111;
    background: #fdfdfb;
  }
  a{ color: #111; }
  a:hover{ color: #888; }
  .back{ display:inline-block; margin-bottom: 3em; font-size: 0.95em; }
  .work{ margin-bottom: 3.2em; }
  .work em{ display:block; margin-top: 0.6em; font-style: italic; font-size: 0.95em; color: #333; }
  .thumb{
    display:block;
    width: 100%;
    aspect-ratio: 16/10;
    border: none;
  }
  .ph1{ background: linear-gradient(135deg, #2a2622, #7c5c47); }
  .ph2{ background: linear-gradient(160deg, #21231f, #5c6b5d); }
  .ph3{ background: linear-gradient(200deg, #201d1a, #8c6f5e); }
</style>
</head>
<body>

<a class="back" href="index.html">← home</a>

<div class="work">
  <a href="#"><div class="thumb ph1"></div></a>
  <em>Non sembra che... (progetto fotografico); fotografia, testi, in sviluppo</em>
</div>

<div class="work">
  <a href="#"><div class="thumb ph2"></div></a>
  <em>Titolo del cortometraggio; girato, montato</em>
</div>

<div class="work">
  <a href="#"><div class="thumb ph3"></div></a>
  <em>Nuovo progetto; sostituisci con titolo e ruolo</em>
</div>

</body>
</html>
